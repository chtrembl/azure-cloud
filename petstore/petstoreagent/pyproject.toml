[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "petstoreagent"
version = "0.1.0"
description = "Azure PetStore Retail Agent - An AI orchestrator agent built on Azure AI Foundry Agent Service that connects to Microsoft Fabric Data Agents for real-time retail intelligence."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "PetStore Team" }
]

dependencies = [
    "azure-ai-projects>=2.1.0",
    "azure-ai-agents>=1.1.0",
    "azure-identity>=1.17.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
